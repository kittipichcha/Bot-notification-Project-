version = 1
revision = 3
requires-python = "==3.12.*"

[manifest]
members = [
    "a2a-server",
    "agent-worker",
    "local-connector",
    "notification-workspace",
]

[[package]]
name = "a2a-server"
version = "0.1.0"
source = { editable = "services/a2a-server" }

[[package]]
name = "agent-worker"
version = "0.1.0"
source = { editable = "services/agent-worker" }

[[package]]
name = "local-connector"
version = "0.1.0"
source = { editable = "services/local-connector" }

[[package]]
name = "notification-workspace"
version = "0.1.0"
source = { virtual = "." }
